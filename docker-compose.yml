version: '3.8'

services:
  gateway:
    build:
      context: ./gateway
      dockerfile: Dockerfile
    ports:
      - "8080:8080"  # Browser WebSocket + Web App
      - "9000:9000"  # Device WebSocket
    environment:
      - NODE_ENV=production
      - BROWSER_PORT=8080
      - DEVICE_PORT=9000
    volumes:
      - ./webapp:/app/../webapp:ro
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:8080/"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 5s
    networks:
      - threadx-net

  emulator:
    build:
      context: ./emulator
      dockerfile: Dockerfile
    depends_on:
      gateway:
        condition: service_healthy
    environment:
      - WS_SERVER_HOST=gateway
      - WS_SERVER_PORT=9000
    networks:
      - threadx-net
    stdin_open: true
    tty: true

networks:
  threadx-net:
    driver: bridge
